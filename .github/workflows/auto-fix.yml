name: autofix.ci

on:
  pull_request:
    branches:
      - main

  merge_group: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: pnpm i

      - name: Lint
        run: pnpm lint --fix

      - uses: autofix-ci/action@v1.3
